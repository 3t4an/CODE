<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                font-family: monospace;
                background-color: rgb(255, 255, 255);
                text-align: center;
            }
        </style>
        <script>
            var PLAYING = true;
            var WORD = "APPLE";
            var ROW = 1;
            function submitWord() {
                var word = document.getElementById("WORD_INPUT").value.toUpperCase();
                if (PLAYING) {
                    for (var i = 0; i < word.length; i++) {

                        id = ROW+"-"+(i+1)

                        if (word[i] == WORD[i]) {
                            document.getElementById(id).style.backgroundColor = "rgb(106, 170, 100)";
                        } else if (WORD.includes(word[i])) {
                            document.getElementById(id).style.backgroundColor = "rgb(201, 180, 88)";
                        } else {
                            document.getElementById(id).style.backgroundColor = "rgb(120, 124, 126)";
                        }

                        document.getElementById(id).value = word[i];
                    }
                    if (word.length > 0) {
                        ROW++;
                    }
                }

                document.getElementById("WORD_INPUT").value = "";
            }
        </script>
    </head>
    <body>
        <div>
            <input id="WORD_INPUT" style="width: 200px; height: 40px; text-align: center;" placeholder="Enter a word" maxlength="5"/><br/>
            <button id="SUBMIT_BUTTON" style="width: 200px; height: 20px;" onclick="submitWord()">Submit</button>
